---
# yamllint disable rule:line-length

# General details
name: "Sweetplace remote cloud"
description: "Empower your Home Assistant with free & secure remote access, ChatGPT powered AI, Google and Alexa support, and more!"
slug: "sweetplace"
url: "https://sweetplace.me"

# The icon used if the user adds our web ui to the side bar.
panel_icon: mdi:home-sound-out
# Indicates we will have Web Ui the user can use.
ingress: true
# Required to access the home assistant web server.
host_network: true
# Required since we our own docker init system.
init: false
# Architetture supportate.
# Solo aarch64 e amd64 sono dichiarate valide dalla documentazione Home Assistant;
# armhf, armv7 e i386 sono deprecate. Questa lista DEVE coincidere con la matrice
# in .github/workflows/build-addon.yaml: se dichiari qui un'architettura per cui la
# CI non pubblica un'immagine, quell'hub non riesce a installare l'add-on.
arch:
  - aarch64
  - amd64

# Map the config folder, we so can add the assistant config snips if needed.
map:
  - homeassistant_config:rw

# We don't use the default port because it conflicts with software like giv_tcp. So we use our own random port.
ingress_port: 45120

# We need to expose the port for the Wyoming protocol for Sage.
ports:
  "11027/tcp": null
ports_description:
  "11027/tcp": "Sweetplace's Sage Assist Wyoming Protocol"

# Add some config options for user to control the addon.
# These options are defined in the schema section below, and the translations for them are in the en.yaml file, which gives them pretty names.
options:
  log_level: "info"
  FACTORY_RESET_CLEAR_DATA: false
schema:
  log_level: list(debug|info|warning|error)?
  FACTORY_RESET_CLEAR_DATA: bool

# Allows the addon to make home assistant authed API calls to the core.
homeassistant_api: true
auth_api: true

# Invece di far costruire l'immagine a Home Assistant sull'hub, la scarica gia' pronta da GHCR.
# Il tag usato e' esattamente il valore di `version:` qui sotto.
# Per lo sviluppo locale va commentata, ma non deve mai essere committata cosi'.
image: ghcr.io/6773939989/sweetlink-addon/{arch}

# Note when this version number changes, we must make a release to start a docker container build immediately, since HA will start looking for the new version.
# Basically: Make the final commit -> test and check lint actions (if a docker change, push to docker-test to ensure it builds) -> bump the version number -> create GitHub release.
# UPDATE THE CHANGE LOG!
version: 2.7.41
