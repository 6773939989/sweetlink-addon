---
# yamllint disable rule:line-length

# General details
name: "Sweetlink"
description: "Secure remote access for your Sweetplace hub, with Google Home and Alexa support."
slug: "sweetplace"
url: "https://sweetplace.me"

# The icon used if the user adds our web ui to the side bar.
# L'ICONA DELLA BARRA LATERALE, E PERCHE' NON E' LA NOSTRA.
#
# Home Assistant disegna questa voce con <ha-icon>, che sa risolvere solo nomi di raccolte
# registrate: mdi: e quelle che un'integrazione dichiara al frontend. Un add-on non puo'
# registrarne una — servirebbe un componente personalizzato dentro Home Assistant, non un
# add-on — quindi qui non si puo' mettere un file SVG nostro.
#
# La sagoma del marchio, ricavata dal logo e pronta all'uso, sta in sweetlink/marchio/. Il
# giorno che ci sara' un'integrazione, il nome da scrivere qui diventa il suo.
# Nel frattempo: mdi:ruler, che e' la stessa cosa che il marchio disegna.
panel_icon: mdi:ruler
# Indicates we will have Web Ui the user can use.
ingress: true
# IL PANNELLO COMPARE NELLA BARRA LATERALE DI TUTTI, NON DEI SOLI AMMINISTRATORI.
#
# Il proprietario di casa e' un utente standard di Home Assistant, non un amministratore: e' una
# scelta voluta, e vuol dire che con il valore predefinito (panel_admin: true) la voce non gli
# comparirebbe, e non avrebbe nessun posto da cui gestire le persone di casa.
#
# Aprirla a tutti non apre niente: la rotta ingress era gia' raggiungibile da qualunque utente
# dell'hub, perche' Home Assistant la lascia aperta apposta ai non amministratori
# (components/hassio/websocket_api.py). Nascondere la voce non chiudeva una porta, la rendeva
# solo difficile da trovare. Quello che conta e' che il pannello mostri a ciascuno solo cio' che
# gli compete e che le rotte che scrivono controllino chi chiama, ed e' cosi' che sono fatte.
panel_admin: false
# Required to access the home assistant web server.
host_network: true
# Required since we our own docker init system.
init: false
# Architetture supportate.
# Solo aarch64 e amd64 sono dichiarate valide dalla documentazione Home Assistant;
# armhf, armv7 e i386 sono deprecate. Questa lista DEVE coincidere con la matrice
# in .github/workflows/build-addon.yaml: se dichiari qui un'architettura per cui la
# CI non pubblica un'immagine, quell'hub non riesce a installare l'add-on.
arch:
  - aarch64
  - amd64

# Map the config folder, we so can add the assistant config snips if needed.
# all_addon_configs serve alla preparazione dell'immagine: prima di clonare il disco va
# cancellata anche la chiave privata di NetBird, che vive nella cartella di configurazione del
# SUO add-on. Senza questa mappa non possiamo nemmeno accorgerci che c'e'.
map:
  - homeassistant_config:rw
  - all_addon_configs:rw

# We don't use the default port because it conflicts with software like giv_tcp. So we use our own random port.
ingress_port: 45120

# Add some config options for user to control the addon.
# These options are defined in the schema section below, and the translations for them are in the en.yaml file, which gives them pretty names.
# L'azzeramento per la clonazione NON sta piu' qui. Era un interruttore che distruggeva
# l'identita' dell'hub senza mostrare nulla di cio' che stava per cancellare, e che andava
# rimesso a mano su "off" dopo l'uso. Ora e' nella pagina dell'add-on, insieme al referto di
# cosa c'e' ancora sul disco e a una parola di conferma da digitare.
options:
  log_level: "info"
schema:
  log_level: list(debug|info|warning|error)?

# Allows the addon to make home assistant authed API calls to the core.
homeassistant_api: true
auth_api: true
# Serve per chiedere al Supervisor di riavviare questo add-on dopo che l'identita' e' stata
# rigenerata: senza riavvio i componenti gia' avviati continuerebbero a usare i valori vecchi.
# Non si puo' contare sul watchdog, che e' un'impostazione dell'utente ed e' spenta di default.
hassio_api: true
# ATTENZIONE: "manager" non e' un permesso ristretto. Il Supervisor con quel ruolo concede fra
# l'altro /host/reboot, /host/shutdown, /os/*, /supervisor/options, /backups* (che contengono i
# dati e i segreti di TUTTI gli add-on) e install/uninstall di qualunque add-on. E' quasi-root
# sull'host, su un processo che gia' gira come root e con host_network.
#
# Lo chiediamo per una cosa sola, e non sostituibile: fermare l'add-on NetBird prima di
# cancellargli la chiave privata durante la preparazione dell'immagine. Se resta vivo la
# riscrive subito, e l'immagine clonata se la porta dietro su tutta la flotta.
#
# Tutto il resto funziona anche senza: senza il ruolo le chiamate rispondono 403, finiscono nei
# log, e il referto dichiara di non aver potuto fermare NetBird invece di tacere.
hassio_role: manager

# Invece di far costruire l'immagine a Home Assistant sull'hub, la scarica gia' pronta da GHCR.
# Il tag usato e' esattamente il valore di `version:` qui sotto.
# Per lo sviluppo locale va commentata, ma non deve mai essere committata cosi'.
image: ghcr.io/6773939989/sweetlink-addon/{arch}

# Note when this version number changes, we must make a release to start a docker container build immediately, since HA will start looking for the new version.
# Basically: Make the final commit -> test and check lint actions (if a docker change, push to docker-test to ensure it builds) -> bump the version number -> create GitHub release.
# UPDATE THE CHANGE LOG!
version: 2.7.70
